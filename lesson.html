<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Hub — Урок</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#D97757',
            bgMain: '#050505',
            bgCard: '#111111',
            textCream: '#F5F1EB'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(217, 119, 87, 0.12), transparent 28%),
        #050505;
    }

    .bg-grid {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(217, 119, 87, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(217, 119, 87, 0.02) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-bgMain text-textCream font-sans antialiased bg-grid">
  <main class="max-w-7xl mx-auto px-6 py-8 md:py-12">
    <div class="mb-8">
      <a href="./portal.html" class="inline-flex rounded-full border border-zinc-800 px-4 py-2 font-mono text-xs uppercase tracking-[0.2em] text-zinc-400 hover:border-brand hover:text-brand transition">
        Назад в портал
      </a>
    </div>

    <div class="grid gap-8 xl:grid-cols-[1.15fr_0.85fr]">
      <section class="rounded-[28px] border border-zinc-900 bg-zinc-950/70 p-6 md:p-8">
        <div id="lesson-label" class="font-mono text-[11px] uppercase tracking-[0.28em] text-brand/80 mb-3"></div>
        <h1 id="lesson-title" class="text-3xl md:text-5xl font-black tracking-tight text-white mb-4"></h1>
        <p id="lesson-intro" class="text-zinc-400 text-base md:text-lg leading-relaxed mb-6 max-w-3xl"></p>
        <div class="flex flex-wrap gap-3 mb-6">
          <a id="lesson-primary-action" href="#" target="_blank" rel="noreferrer" class="hidden inline-flex rounded-full bg-brand px-6 py-3 font-mono text-xs font-bold uppercase tracking-[0.24em] text-bgMain hover:opacity-95 transition">
            Открыть видео
          </a>
          <a id="lesson-secondary-action" href="#" target="_blank" rel="noreferrer" class="hidden inline-flex rounded-full border border-zinc-700 px-6 py-3 font-mono text-xs font-bold uppercase tracking-[0.24em] text-zinc-200 hover:border-brand hover:text-brand transition">
            Открыть гайд
          </a>
        </div>
        <div id="lesson-open" class="hidden">
          <div class="overflow-hidden rounded-[24px] border border-zinc-900 bg-black">
            <div id="lesson-video"></div>
          </div>
        </div>
        <div id="lesson-locked" class="hidden rounded-[24px] border border-zinc-900 bg-black/30 p-8 text-zinc-400">
          Этот урок пока закрыт. Когда откроется, здесь появятся видео, гайд и домашка.
        </div>
      </section>

      <aside class="rounded-[28px] border border-zinc-900 bg-zinc-950/70 p-6 md:p-8">
        <div class="font-mono text-[11px] uppercase tracking-[0.28em] text-zinc-500 mb-3">Гайд</div>
        <h2 class="text-2xl font-black tracking-tight text-white mb-4">
          Что сделать после просмотра
        </h2>
        <ul id="lesson-after-watch" class="space-y-3 text-zinc-300 leading-relaxed mb-6"></ul>
        <div class="rounded-2xl border border-zinc-900 bg-bgCard/40 p-4">
          <div class="font-mono text-[10px] uppercase tracking-[0.24em] text-zinc-500 mb-2">Домашка</div>
          <div id="lesson-homework" class="text-zinc-300"></div>
        </div>
      </aside>
    </div>
  </main>

  <script type="module" src="./lesson.js"></script>
</body>
</html>
